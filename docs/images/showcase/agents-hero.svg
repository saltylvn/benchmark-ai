<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">The Benchmark team</title>
  <desc id="desc">Hero overview of the Benchmark supervisor and the four specialists Intake, Scheduling, Drafting, and Briefing.</desc>
  <style>text { font-family: "Liberation Sans", "Segoe UI", system-ui, sans-serif; } .serif { font-family: Georgia, "Liberation Serif", Palatino, serif; }</style>
  <rect width="1600" height="640" fill="#f3f0e8"/>
  
    <text x="48" y="56" class="serif" font-size="34" fill="#221f1a">The Benchmark team</text>
    <text x="48" y="88" font-size="16" fill="#3a342c">One lead routes four specialists. Maria approves money, dates, and anything a homeowner would see.</text>
    <rect x="48" y="116" width="1504" height="150" rx="14" fill="#2c3d86"/>
    <text x="72" y="158" fill="#fffdf9" font-size="26" font-weight="700">Supervisor</text>
    <text x="72" y="188" fill="#e7ebf6" font-size="16">The only router. It calls Intake, then Scheduling, then the critic, then Drafting and Briefing.</text>
    <text x="72" y="216" fill="#e7ebf6" font-size="16">A rejection returns to Scheduling. Three revisions is the cap. Nothing is sent from this demo.</text>
    <text x="72" y="244" fill="#c9d2f2" font-size="13">orchestrator/supervisor.ts. The checklist is critic.ts, not a fifth specialist.</text>
    <rect x="48" y="290" width="364" height="220" rx="14" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
          <text x="68" y="330" fill="#2c3d86" font-size="13" font-weight="700" letter-spacing="0.08em">SPECIALIST</text>
          <text x="68" y="364" fill="#221f1a" font-size="24" font-weight="700">Intake</text>
          <text x="68" y="400" fill="#3a342c" font-size="15">Reads the calendar, the inbox, and the job file.</text>
          <text x="68" y="470" fill="#5c564c" font-size="14">Hands off to Scheduling</text><rect x="428" y="290" width="364" height="220" rx="14" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
          <text x="448" y="330" fill="#2c3d86" font-size="13" font-weight="700" letter-spacing="0.08em">SPECIALIST</text>
          <text x="448" y="364" fill="#221f1a" font-size="24" font-weight="700">Scheduling</text>
          <text x="448" y="400" fill="#3a342c" font-size="15">Proposes a day. Tries again if the critic rejects it.</text>
          <text x="448" y="470" fill="#5c564c" font-size="14">Hands off to the critic</text><rect x="808" y="290" width="364" height="220" rx="14" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
          <text x="828" y="330" fill="#2c3d86" font-size="13" font-weight="700" letter-spacing="0.08em">SPECIALIST</text>
          <text x="828" y="364" fill="#221f1a" font-size="24" font-weight="700">Drafting</text>
          <text x="828" y="400" fill="#3a342c" font-size="15">Writes calendar, email, and Slack drafts.</text>
          <text x="828" y="470" fill="#5c564c" font-size="14">Hands off to Briefing</text><rect x="1188" y="290" width="364" height="220" rx="14" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
          <text x="1208" y="330" fill="#2c3d86" font-size="13" font-weight="700" letter-spacing="0.08em">SPECIALIST</text>
          <text x="1208" y="364" fill="#221f1a" font-size="24" font-weight="700">Briefing</text>
          <text x="1208" y="400" fill="#3a342c" font-size="15">Three outcomes and a call card.</text>
          <text x="1208" y="470" fill="#5c564c" font-size="14">Then the supervisor closes</text>
    <text x="48" y="560" font-size="15" fill="#3a342c">The Thursday demo is the implemented path. A weekly report, a change-order replan, and a mailbox API are not in this repository.</text>
    <text x="48" y="592" font-size="14" fill="#5c564c">Maria's approval sits outside the agents. Drafts stay in memory with status draft.</text>
</svg>