<script>
(function () {
  var state = JSON.parse(document.getElementById('app-state').textContent);
  var form = document.querySelector('[data-ask-form]');
  if (!form) return;
  var input = form.querySelector('input');
  var go = form.querySelector('button');
  var out = document.querySelector('[data-ask-answer]');

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  // Render plain text safely: "- " lines become a list, [J-1234] becomes a tappable job chip.
  function renderAnswer(text) {
    var frag = document.createDocumentFragment();
    var list = null;
    text.split(/\n+/).forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var bullet = /^[-•*]\s+/.test(line);
      var holder = bullet ? el('li') : el('p');
      line.replace(/^[-•*]\s+/, '').split(/(\[J-\d{3,4}\])/).forEach(function (part) {
        var m = part.match(/^\[(J-\d{3,4})\]$/);
        if (m) {
          var a = el('a', 'ask-job', m[1]);
          a.href = '#jobs';
          a.dataset.job = m[1];
          holder.appendChild(a);
        } else {
          holder.appendChild(document.createTextNode(part.replace(/\*\*/g, '')));
        }
      });
      if (bullet) { if (!list) { list = el('ul'); frag.appendChild(list); } list.appendChild(holder); }
      else { list = null; frag.appendChild(holder); }
    });
    return frag;
  }

  function show(question, body, kind) {
    out.hidden = false;
    out.className = 'ask-answer ' + (kind || '');
    out.textContent = '';
    out.appendChild(el('p', 'ask-q', question));
    if (typeof body === 'string') out.appendChild(el('p', null, body)); else out.appendChild(body);
  }

  function askQuestion(q) {
    q = (q || '').trim();
    if (!q) { input.focus(); return; }
    input.value = q;
    go.disabled = true;
    go.textContent = 'Thinking…';
    show(q, 'Reading this morning’s check…', 'loading');
    fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Form-Token': state.token },
      body: JSON.stringify({ question: q }),
    }).then(function (res) {
      return res.json().then(function (body) { if (!res.ok) throw new Error(body.error || 'Something went wrong'); return body; });
    }).then(function (body) {
      var frag = renderAnswer(body.answer);
      if (body.left != null && body.left <= 3) frag.appendChild(el('p', 'muted small', body.left + ' question' + (body.left === 1 ? '' : 's') + ' left this session.'));
      show(q, frag, body.ok ? 'ok' : 'held');
    }).catch(function (err) {
      show(q, err.message, 'held');
    }).then(function () {
      go.disabled = false;
      go.textContent = 'Ask';
    });
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); askQuestion(input.value); });
  document.addEventListener('click', function (e) {
    var s = e.target.closest('[data-ask]');
    if (s) { askQuestion(s.dataset.ask); return; }
    var j = e.target.closest('.ask-job');
    if (j) {
      // Jump to the job's card on the Jobs tab and flash it.
      setTimeout(function () {
        var card = Array.prototype.find.call(document.querySelectorAll('.jcard'), function (c) { return c.textContent.indexOf(j.dataset.job) >= 0; });
        if (card) { card.scrollIntoView({ block: 'center', behavior: 'smooth' }); card.classList.add('flash'); setTimeout(function () { card.classList.remove('flash'); }, 1600); }
      }, 60);
    }
  });
})();
</script>
