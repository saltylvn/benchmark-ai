<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Supervisor</title>
  <desc id="desc">Supervisor for Benchmark: role, triggers, inputs, outputs, tools, hand-off, and where a person approves.</desc>
  <style>text { font-family: "Liberation Sans", "Segoe UI", system-ui, sans-serif; } .serif { font-family: Georgia, "Liberation Serif", Palatino, serif; }</style>
  <rect width="1280" height="860" fill="#f3f0e8"/>
  
    <text x="40" y="52" class="serif" font-size="32" fill="#221f1a">Supervisor</text>
    <text x="40" y="84" font-size="16" fill="#3a342c">The only router. Specialists do not call each other.</text>
    <text x="40" y="110" font-size="13" fill="#5c564c">orchestrator/supervisor.ts and critic.ts</text>
    <rect x="40" y="140" width="584" height="168" rx="12" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
          <text x="60" y="172" fill="#5c564c" font-size="12" font-weight="700" letter-spacing="0.08em">TRIGGERS</text>
          <text x="60" y="212" fill="#221f1a" font-size="16">Thursday run, or the quiet morning</text>
          <text x="60" y="242" fill="#3a342c" font-size="16">A critic score comes back</text><rect x="640" y="140" width="584" height="168" rx="12" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
          <text x="660" y="172" fill="#5c564c" font-size="12" font-weight="700" letter-spacing="0.08em">INPUTS</text>
          <text x="660" y="212" fill="#221f1a" font-size="16">The fixture day and the goal</text>
          <text x="660" y="242" fill="#3a342c" font-size="16">Failure codes, up to three tries</text><rect x="40" y="324" width="584" height="168" rx="12" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
          <text x="60" y="356" fill="#5c564c" font-size="12" font-weight="700" letter-spacing="0.08em">OUTPUTS</text>
          <text x="60" y="396" fill="#221f1a" font-size="16">The trace and the run status</text>
          <text x="60" y="426" fill="#3a342c" font-size="16">approved, or needs_human</text><rect x="640" y="324" width="584" height="168" rx="12" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
          <text x="660" y="356" fill="#5c564c" font-size="12" font-weight="700" letter-spacing="0.08em">TOOLS</text>
          <text x="660" y="396" fill="#221f1a" font-size="16">None of its own</text>
          <text x="660" y="426" fill="#3a342c" font-size="16">Passes the read-only toolkit to Intake</text><rect x="40" y="508" width="584" height="168" rx="12" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
          <text x="60" y="540" fill="#5c564c" font-size="12" font-weight="700" letter-spacing="0.08em">HANDS OFF TO</text>
          <text x="60" y="580" fill="#221f1a" font-size="16">Intake first</text>
          <text x="60" y="610" fill="#3a342c" font-size="16">Scheduling again, or Drafting at 100</text><rect x="640" y="508" width="584" height="168" rx="12" fill="#fbeeee" stroke="#9b2832" stroke-width="1.5"/>
          <text x="660" y="540" fill="#9b2832" font-size="12" font-weight="700" letter-spacing="0.08em">WHERE MARIA APPROVES</text>
          <text x="660" y="580" fill="#221f1a" font-size="16">Stops for a person after three misses</text>
          <text x="660" y="610" fill="#3a342c" font-size="16">Maria still approves a send</text>
</svg>