# Manual only. Do not run this on every push.
# This private repository does not have GitHub Pages enabled, so a push
# trigger fails with "Get Pages site failed... Not Found".
# Dispatch this workflow only after Benchmark has a public home and Pages
# is turned on for that site. Until then, copy docs/ to any static host.
# See the "Publish the static demo" section of the README.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
