<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Benchmark is a team of AI agents for construction project managers. Mock demo, nothing is sent."
    />
    <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <title>Benchmark</title>
    <script>
      (function () {
        var choice = "system";
        try {
          choice = localStorage.getItem("benchmark-theme") || "system";
        } catch (error) {}
        var dark =
          choice === "dark" ||
          (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <p class="boot">Loading Thursday…</p>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
