<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">Friday owner report</title>
  <desc id="desc">Friday owner report. Before and after steps. Minutes are illustrative estimates from A9, not measured results.</desc>
  <style>text { font-family: "Liberation Sans", "Segoe UI", system-ui, sans-serif; } .serif { font-family: Georgia, "Liberation Serif", Palatino, serif; }</style>
  <rect width="1440" height="700" fill="#f3f0e8"/>
  
    <text x="40" y="48" class="serif" font-size="30" fill="#221f1a">Friday owner report</text>
    <rect x="40" y="68" width="72.4" height="22" rx="11" fill="#f8efe3" stroke="#8a4e0c"/>
    <text x="51" y="83" fill="#8a4e0c" font-size="12" font-weight="700">PLANNED</text>
    <text x="40" y="120" font-size="16" fill="#3a342c">Illustrative estimate A9. Manual 40 min, review 8 min, difference 32 min. Not a measurement.</text>
    <rect x="40" y="150" width="640" height="420" rx="14" fill="#fffdf9" stroke="#d2c8b8" stroke-width="1.5"/>
    <text x="64" y="190" fill="#d2c8b8" font-size="14" font-weight="700" letter-spacing="0.08em">BEFORE</text>
    <text x="64" y="250" fill="#221f1a" font-size="18" font-weight="700">1</text>
           <text x="96" y="250" fill="#3a342c" font-size="16">Collect finished work and slips.</text><text x="64" y="322" fill="#221f1a" font-size="18" font-weight="700">2</text>
           <text x="96" y="322" fill="#3a342c" font-size="16">Write the owner by hand.</text><text x="64" y="394" fill="#221f1a" font-size="18" font-weight="700">3</text>
           <text x="96" y="394" fill="#3a342c" font-size="16">Send it after hours.</text>
    <rect x="760" y="150" width="640" height="420" rx="14" fill="#f8efe3" stroke="#8a4e0c" stroke-width="1.5"/>
    <text x="784" y="190" fill="#8a4e0c" font-size="14" font-weight="700" letter-spacing="0.08em">AFTER</text>
    <text x="784" y="250" fill="#221f1a" font-size="18" font-weight="700">1</text>
           <text x="816" y="250" fill="#3a342c" font-size="16">A draft report would wait for Maria.</text><text x="784" y="322" fill="#221f1a" font-size="18" font-weight="700">2</text>
           <text x="816" y="322" fill="#3a342c" font-size="16">The owner would not get it automatically.</text><text x="784" y="394" fill="#221f1a" font-size="18" font-weight="700">3</text>
           <text x="816" y="394" fill="#3a342c" font-size="16">Not implemented.</text>
    <text x="40" y="640" font-size="15" fill="#5c564c">From docs/TIME_SAVED.md. Maria reviews. Nothing in this demo is sent.</text>
</svg>