<div id="welcome" class="welcome-view">{{ welcome | safe }}</div>
<div id="app" class="app-view" hidden>{{ app_html | safe }}</div>
<script>
  // No hash: the welcome card. Any app hash (#today, #jobs, ...): the app, which routes its own tabs.
  (function () {
    function route() {
      var inApp = !!(location.hash && location.hash !== '#welcome');
      document.getElementById('welcome').hidden = inApp;
      document.getElementById('app').hidden = !inApp;
      if (inApp) window.dispatchEvent(new Event('resize'));
    }
    window.addEventListener('hashchange', route);
    route();
  })();
</script>
