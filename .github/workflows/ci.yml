name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agents:
    name: Agent team (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test

  dashboard:
    name: PM dashboard (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: dashboard/requirements-dev.txt
      - run: pip install -r dashboard/requirements-dev.txt
      - run: ruff check dashboard
      - name: Audit Python dependencies
        if: matrix.python == '3.12'
        run: pip install pip-audit && pip-audit -r dashboard/requirements.txt
      - run: python -m unittest discover -s dashboard/tests -t . -v
